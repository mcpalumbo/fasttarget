# FastTarget Configuration File
# 
# To validate this configuration before running:
#   python configuration.py --config_file config.yml
#
# To run the pipeline:
#   python fasttarget.py --config_file config.yml

# ---- Organism information ----
organism:
  # name: Complete with a short alias/name for your genome, without spaces. Example: PAO1 for Pseudomonas aeruginosa PAO1.
  name: "MyPathogen"
  # tax_id: Fill with the number of NCBI Taxonomy ID of the specie of your organism. Example: 287 for Pseudomonas aeruginosa.
  # It is used to obtain the genomes to calculate the core genome.
  tax_id: 123456
  # strain_taxid: Fill with the number of NCBI Taxonomy ID of the strain of your organism. Example: 208964 for Pseudomonas aeruginosa PAO1.
  # It is used for structure analysis to map strain-specific proteins.
  strain_taxid: 123456
  # gbk_file: Complete with the full path of the GBK file of your genome.
  gbk_file: /path/to/mypathogen.gbk

# ---- CPU usage preferences ----
# cpus: Number of CPUs to use for parallel processing. Use 'null' for auto-detection, or specify a number (e.g., 4, 8, 16).
cpus: null

# ---- Container Engine ----
# container_engine: Choose 'docker' or 'singularity' for running containerized tools.
# Make sure to run the appropriate setup script (setup_docker.sh or setup_containers.sh) before using.
# Valid options: docker, singularity, apptainer
container_engine: docker

# ---- Metabolism ----
# Optional pathway and GO annotations. Runs without a metabolic network model.
metabolism-annotation:
  enabled: False
  go_slim: True
  # kegg_organism: pau  # Optional; otherwise resolve exact organism.strain_taxid.
  # sbml_file: /path/to/model.xml  # Optional; uses the enabled metabolic model if present.

metabolism-eggnog:
  enabled: False
  # Output of eggNOG-mapper (e.g. the eggNOG 7 web server) run on the organism .faa.
  annotations_file: /path/to/query.emapper.annotations
  # Lowest annotation confidence kept (high | medium | low). high: seed or one-to-one
  # ortholog; medium: one-to-many/many-to-one; low: many-to-many (paralogs, function may differ).
  # Dropped values are listed in eggnog_low_confidence_dropped.
  min_confidence: medium

metabolism-PathwayTools:
  enabled: False
  network_metrics:
    random_networks: 100
    seed: 42
    pagerank_alpha: 0.85
  # sbml_file: Fill with the path of the SBML file generated by Pathway Tools.
  sbml_file: /path/to/model.sbml
  # chokepoint_file: Fill with the path of the chokepoints file report generated by Pathway Tools.
  chokepoint_file: /path/to/chokepoints.txt
  # smarttable_file: Fill with the path of the Genes smarttable generated by Pathway Tools.
  smarttable_file: /path/to/genes_smarttable.tsv
  # curated_ubiquitous_file: (Optional) Fill with the path to a pre-curated ubiquitous compounds file.
  # If not provided, the auto-generated file will be used. For better results, manually curate this file.
  curated_ubiquitous_file: /path/to/curated_ubiquitous.txt

metabolism-SBML:
  enabled: False
  network_metrics:
    random_networks: 100
    seed: 42
    pagerank_alpha: 0.85
  # sbml_file: Fill with the path of the SBML file of your organism's metabolic model.
  sbml_file: /path/to/model.sbml
  # filter_file: Fill with the path of the filter compounds file to exclude ubiquitous compounds from graph generation.
  filter_file: /path/to/filter_compounds.tsv

# ---- Structures ----
structures: 
  enabled: False
  # pocket_full_mode: Set to True to find pockets to all structures for each protein, not only the best one.
  # Set to True will significantly increase runtime and resource usage.
  pocket_full_mode: False
  # uniparc_fallback: Set to True to resolve genes that BLAST could not map by looking them
  # up in UniParc by sequence checksum, then accepting an AlphaFold DB model only when its
  # sequence is byte-identical to your protein. Useful for under-studied organisms, whose
  # UniProt entries are pruned as "not part of a reference proteome" even though AlphaFold
  # still serves a model. Runs after the BLAST tiers, so it never displaces a PDB hit.
  # Requires internet access and adds a few requests per unmapped gene.
  uniparc_fallback: False
  
colabfold:
  enabled: False
  # amber: Set to True to perform Amber refinement on ColabFold models.
  amber: False
  # gpu: Set to True to use GPU acceleration for ColabFold model generation.
  gpu: False
  # colabfold_run_all: Set to True to run ColabFold for all proteins, not only those without structures.
  colabfold_run_all: False


# ---- Ligands ----
# Known or predicted ligands for each protein, from three independent sources:
#   chembl / bindingdb: measured bioactivity data (local databases, no internet needed).
#   alphafill: ligands transplanted from homologous PDB structures onto AlphaFold models
#              (needs internet, or files downloaded with rsync).
# Runs on its own: it does not need structures.enabled. If the structures module already
# created the UniProt mapping, it is reused; otherwise it is created (no pockets/ColabFold).
# Results: organism/<name>/ligands/<source>/. Each source adds one row per locus_tag to the
# final table; detailed tables and a README.txt are written in each source folder.
ligands:
  enabled: False
  # taxonomy_dir: NCBI taxonomy folder (nodes.dmp) used to include all strains/subspecies
  # below organism.tax_id when searching ChEMBL/BindingDB. null: use the local copy
  # prepared by databases.py. Relative paths are resolved against --databases_path.
  taxonomy_dir: null

  # ChEMBL: compounds with activity measured on proteins of this species. The ChEMBL
  # target sequences are aligned to your proteins (BLAST) to assign them to locus_tags.
  # Final table: chembl_status, chembl_target_count, chembl_compounds, chembl_compound_count.
  chembl:
    enabled: False
    # database: path to the ChEMBL SQLite file. null: newest version downloaded with
    # databases.py --download chembl.
    database: null
    # include_human: also count activity of the same compounds on human targets
    # (selectivity/toxicity context). Reported in the detail tables.
    include_human: False
    # include_species_context: also collect cellular/whole-organism assays in this species
    # (e.g. MIC), which have no molecular target. Reported separately, never as binding.
    include_species_context: True
    # min_identity / min_coverage (%): minimum BLAST identity and coverage (of both
    # sequences) to assign a ChEMBL target to one of your proteins.
    min_identity: 90
    min_coverage: 70
    # direct_only: True keeps only activities directly assigned to the protein target
    # (ChEMBL relationship type D), excluding homologue/complex assignments.
    direct_only: False
    # min_confidence_score: minimum ChEMBL target assignment confidence (0-9; 9 = direct
    # single protein). null: no filter.
    min_confidence_score: null
    # require_pchembl: True keeps only activities with a standardized potency value (pChEMBL).
    require_pchembl: False
    # exclude_problematic: True drops activities flagged by ChEMBL as potentially invalid
    # (data_validity_comment), unless manually validated.
    exclude_problematic: True
    # strict_errors: True stops the pipeline if ChEMBL fails; False records the error and continues.
    strict_errors: False

  # BindingDB: measured binding affinities (Ki, Kd, IC50, EC50) on proteins of this species,
  # assigned to locus_tags by BLAST as for ChEMBL.
  # Final table: bindingdb_status, bindingdb_target_count, bindingdb_compounds, bindingdb_compound_count.
  bindingdb:
    enabled: False
    # database: path to the BindingDB SQLite/dump. null: version downloaded with
    # databases.py --download bindingdb.
    database: null
    # include_human: also count measurements of the same compounds on human proteins/complexes.
    include_human: False
    # min_identity / min_coverage (%): BLAST thresholds to assign a BindingDB target to a locus_tag.
    min_identity: 90
    min_coverage: 70
    # strict_errors: True stops the pipeline if BindingDB fails; False records the error and continues.
    strict_errors: False

  # AlphaFill: ligands, cofactors and metals present in PDB structures of homologous
  # proteins, transplanted onto the AlphaFold model of each protein (alphafill.eu).
  # Each transplant gets a confidence: high, intermediate (both = "accepted"), low or unknown.
  # Final table: alphafill_status, alphafill_complete, compounds and counts per confidence,
  # alphafill_unique_compounds, alphafill_unique_accepted_compounds, plus the
  # alphafill_pocket_* columns (see pocket_overlap below).
  # Start with ligands/alphafill/README.txt and alphafill_selection.tsv.
  alphafill:
    enabled: True
    # download_cif: which AlphaFill models (.cif with the ligands) to download into
    #   ligands/alphafill/models/<locus_tag>/:
    #   always = every protein with an AlphaFill entry; accepted_only = only proteins with
    #   high/intermediate transplants; never = only the metadata (no 3D models).
    download_cif: always
    # generate_pymol: write a PyMOL script next to each model, with every ligand as a
    # separate object colored by confidence (in PyMOL: run <file>_view_alphafill.py).
    generate_pymol: True
    # enrich_donors: identify the protein each ligand was copied from (UniProt, name,
    # organism) via RCSB/UniProt. Annotation only, it does not change any result.
    # The first run can take hours (one query per donor chain); results are cached.
    enrich_donors: True
    # Downloads: parallel workers, timeout (s), retries and initial wait between retries (s).
    # https_min_interval: minimum seconds between HTTPS requests to alphafill.eu, shared by
    #   all workers (0.5 = at most 2 requests/s). Avoids being blocked by the server.
    # max_connection_failures: after this many consecutive connection errors to a server,
    #   stop contacting it in this run; affected entries are marked incomplete (rerun later).
    https_min_interval: 0.5
    max_connection_failures: 10
    max_workers: 4
    timeout: 30
    retries: 3
    backoff: 1
    # rsync_proxy: host:port of a SOCKS proxy for rsync downloads, e.g. an SSH tunnel opened
    # with `ssh -D 1080 user@server` -> localhost:1080. Use it when rsync.alphafill.eu
    # (port 873) is blocked on your network. "": direct connection.
    # Downloads use rsync first; HTTPS only for files rsync could not get.
    rsync_proxy: ""
    # refresh_cache: True downloads everything again; False reuses cached files.
    refresh_cache: False
    # strict_errors: True saves the available results and then stops if some downloads or
    # annotations failed (useful to retry). Proteins absent from AlphaFill are not errors.
    strict_errors: False
    # Confidence of each transplant, from AlphaFill fit metrics: local RMSD (Angstrom, fit of
    # the binding site residues) and TCS (transplant clash score). Both must be below the
    # limits: high if < high_*, intermediate if < intermediate_*, otherwise low.
    # Sequence identity with the donor and global RMSD are reported but do not filter.
    high_local_rmsd: 0.92
    high_tcs: 0.64
    intermediate_local_rmsd: 3.10
    intermediate_tcs: 1.27

    # pocket_overlap: check whether AlphaFill ligands fall in the pockets predicted by fpocket
    # and P2Rank (needs a previous structures run). Pockets and AlphaFill models may come from
    # different structures, so residues are compared by their position in your protein
    # sequence. For each ligand it reports:
    #   best_*  : the best pocket chosen by the structures module (highest fpocket
    #             druggability / P2Rank ligandability; for AlphaFold/ColabFold models,
    #             among pockets with mean pLDDT >= 70) and how much the ligand overlaps it;
    #   match_* : the pocket the ligand coincides with most, its score and rank, and the overlap.
    # Overlap (%) = ligand contact residues inside the pocket / all ligand contact residues.
    # Output: ligands/alphafill/pocket_overlap/ (one row per ligand + one row per locus_tag).
    # Run it alone after AlphaFill: python -m ftscripts.pocket_overlap --output_path organism --organism <name>
    pocket_overlap: True
    # pocket_exclude_ions: ignore ions (Zn, Mg, Na, SO4, ...): too small, false positive matches.
    pocket_exclude_ions: True
    # pocket_exclude_artifacts: ignore crystallization artifacts and noise (water, CO2, PEG,
    # glycerol, detergents, buffers, solvents): BioLiP list, ftscripts/data/biolip_artifacts.tsv.
    pocket_exclude_artifacts: True
    # pocket_exclude_prosthetic: ignore prosthetic groups that stay bound in the structure
    # (heme, Fe-S clusters, molybdopterin, cobalamin): their cavity is not a drug site.
    # Mobile cofactors (ATP, NAD, FAD, CoA...) are always compared; the summary lists the
    # compounds in each pocket with and without them (*_non_cofactor_compounds).
    pocket_exclude_prosthetic: True
    # pocket_contact_cutoff: distance (Angstrom) from a ligand atom for a residue to count as contact.
    pocket_contact_cutoff: 4.5
    # pocket_min_overlap: per-locus summary only. A compound is listed as "in the pocket"
    # (*_compounds columns) if at least this % of its contact residues fall inside that pocket.
    # The per-ligand table always reports the exact %.
    pocket_min_overlap: 50
    # pocket_min_contact_residues: ligands touching fewer residues are reported (status
    # few_contacts) but left out of the summary: their % is not meaningful.
    pocket_min_contact_residues: 4
    # pocket_min_mapping_identity: minimum % identity to map a structure or model onto your
    # protein sequence; lower values are rejected (wrong protein).
    pocket_min_mapping_identity: 90

# ---- Core ----
core:
  enabled: False
  roary: False
  corecruncher: False
  # panaroo: Graph-based pangenome (corrects fragmented, missing and contaminant annotations).
  # Uses min_identity (Panaroo -c) and min_core_freq like Roary/CoreCruncher. Image staphb/panaroo:1.8.0.
  panaroo: False
  # panaroo_mode: Panaroo --clean-mode: strict (recommended for core genes), moderate or sensitive.
  panaroo_mode: strict
  # min_identity: Minimum percentage identity for core genome analysis (0-100). Example: 95 for 95% identity.
  min_identity: 95
  # min_core_freq: Minimum frequency for a gene to be considered core (0-100). Example: 99 means gene must be present in 99% of genomes.
  min_core_freq: 99
  protein_qc:
    warn_ratio: 0.8
    exclude_ratio: 0.5
  # Python pipeline: dRep runs only above this downloaded-assembly count.
  dereplication:
    enabled: false
    min_genomes: 300  # Set 0 to exercise dRep on a small dataset.
  # accession_file: (Optional) Path to a text file with one NCBI assembly accession per line.
  # If provided, only these specific genomes will be downloaded instead of all genomes from tax_id.
  # Leave empty, set to null, or comment out to download all genomes from tax_id.
  # Example file format (one accession per line):
  #   GCF_000006945.2
  #   GCF_000027345.1
  #   GCF_000319655.2
  accession_file: null

# ---- Offtarget ----
offtarget:
  enabled: False
  human: False
  microbiome: False
  # Maximum DIAMOND threads per representative genome or Nextflow microbiome task.
  microbiome_threads_per_genome: 4
  # Add any combination of: human-gut, human-oral, human-skin, human-vaginal,
  # marine, soil, barley-rhizosphere, maize-rhizosphere, tomato-rhizosphere.
  microbiome_catalogues:
    - name: human-gut
      identity_filter: 40
      coverage_filter: 70
  # foldseek_human: True if you want to use Foldseek to search for human off-targets. 
  # NOTE: Requires both 'offtarget' AND 'structures' to be enabled.
  foldseek_human: False

# ---- DEG ----
deg:
  enabled: False
  # deg_identity_filter: Filter value of %identity, only hits with higher values will be used. Recommended: 30-60.
  deg_identity_filter: 40
  # deg_coverage_filter: Filter value of query coverage, only hits with higher values will be used. Recommended: 50-80.
  deg_coverage_filter: 70

# ---- Localization ----
psortb:
  enabled: False
  # gram_type: Complete with the type of organism: 'n' (Gram-), 'p' (Gram+), or 'a' (archaea).
  gram_type: n

# ---- Metadata ----
metadata:
  enabled: False
  # meta_tables: Fill with the full paths of the metadata tables.
  meta_tables:
    - /path/to/meta_table1.tsv
    - /path/to/meta_table2.tsv
    # Add more paths as needed
